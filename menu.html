<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Tetris - Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Press Start 2P', monospace;
        background-image: url('img/background.jpg');
        background-size: cover;
        background-position: center;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        user-select: none;
      }

      .menu-container {
        background: rgba(0, 0, 0, 0.85);
        padding: 60px 80px;
        border-radius: 20px;
        box-shadow: 0 10px 50px rgba(0, 0, 0, 0.5);
        text-align: center;
        max-width: 600px;
      }

      h1 {
        color: #00ff00;
        font-size: 48px;
        margin-bottom: 20px;
        text-shadow: 3px 3px 0 #006600;
      }

      .subtitle {
        color: #ffffff;
        font-size: 14px;
        margin-bottom: 60px;
        opacity: 0.8;
      }

      .menu-buttons {
        display: flex;
        flex-direction: column;
        gap: 30px;
      }

      .menu-button {
        background: linear-gradient(180deg, #4a90e2 0%, #2e5c8a 100%);
        color: white;
        border: 4px solid #1a3a5a;
        padding: 25px 40px;
        font-family: 'Press Start 2P', monospace;
        font-size: 20px;
        cursor: pointer;
        text-decoration: none;
        display: block;
        border-radius: 10px;
        transition: all 0.2s;
        box-shadow: 0 5px 0 #1a3a5a;
      }

      .menu-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 0 #1a3a5a;
        background: linear-gradient(180deg, #5aa5ff 0%, #3a6c9a 100%);
      }

      .menu-button:active {
        transform: translateY(2px);
        box-shadow: 0 3px 0 #1a3a5a;
      }

      .menu-button.multiplayer {
        background: linear-gradient(180deg, #e24a4a 0%, #8a2e2e 100%);
        border-color: #5a1a1a;
        box-shadow: 0 5px 0 #5a1a1a;
      }

      .menu-button.multiplayer:hover {
        background: linear-gradient(180deg, #ff5a5a 0%, #9a3a3a 100%);
        box-shadow: 0 8px 0 #5a1a1a;
      }

      .menu-button.multiplayer:active {
        box-shadow: 0 3px 0 #5a1a1a;
      }

      .footer {
        margin-top: 40px;
        color: #888;
        font-size: 10px;
      }

      @media screen and (max-width: 700px) {
        .menu-container {
          padding: 40px 30px;
          margin: 20px;
        }

        h1 {
          font-size: 32px;
        }

        .menu-button {
          font-size: 16px;
          padding: 20px 30px;
        }
      }
    </style>
  </head>
  <body>
    <div class="menu-container">
      <h1>TETRIS</h1>
      <div class="subtitle">Select Game Mode</div>

      <div class="menu-buttons">
        <a href="/singleplayer" class="menu-button">
          Single Player
        </a>
        <a href="/multiplayer" class="menu-button multiplayer">
          Multiplayer
        </a>
      </div>

      <div class="footer">
        Original: Mikael Majling (2010)<br>
        Modernized: 2024
      </div>
    </div>
  </body>
</html>
