<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Tetris - Multiplayer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Press Start 2P', monospace;
        background-image: url('img/background.jpg');
        background-size: cover;
        user-select: none;
        overflow: hidden;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      #gameContainer {
        display: flex;
        gap: 40px;
        padding: 20px;
        background: rgba(0, 0, 0, 0.7);
        border-radius: 10px;
      }

      .player-section {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .player-label {
        color: #00ff00;
        font-size: 16px;
        margin-bottom: 10px;
        text-shadow: 2px 2px 0 #006600;
      }

      .opponent-label {
        color: #ff4444;
        text-shadow: 2px 2px 0 #660000;
      }

      #tetris, #opponentBoard {
        background-color: transparent;
        background-image: url('img/bg.png');
        background-size: cover;
        border: 4px solid #333;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      }

      #opponentBoard {
        opacity: 0.8;
        width: 200px;
        height: 400px;
      }

      .info-panel {
        margin-top: 20px;
        color: white;
      }

      #scoreBoard, #statusBoard {
        font-size: 14px;
        line-height: 20px;
        margin-bottom: 10px;
      }

      #statusBoard {
        color: #ffff00;
        font-size: 16px;
        text-align: center;
        min-height: 40px;
      }

      #nextPieceContainer {
        list-style: none;
      }

      #nextPiece {
        width: 100px;
        height: 100px;
        margin-bottom: 20px;
      }

      .back-button {
        position: fixed;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        border: 2px solid #666;
        padding: 10px 20px;
        font-family: 'Press Start 2P', monospace;
        font-size: 12px;
        cursor: pointer;
        text-decoration: none;
        border-radius: 5px;
        transition: all 0.2s;
      }

      .back-button:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: #999;
      }

      @media screen and (max-width: 900px) {
        #gameContainer {
          flex-direction: column;
          gap: 20px;
        }

        #opponentBoard {
          width: 150px;
          height: 300px;
        }

        .player-label {
          font-size: 12px;
        }

        #scoreBoard {
          font-size: 11px;
          line-height: 16px;
        }
      }
    </style>
  </head>
  <body>
    <a href="/" class="back-button">← Menu</a>

    <div id="gameContainer">
      <div class="player-section">
        <div class="player-label">YOU</div>
        <canvas id="tetris" width="300" height="600">
          <p>Your browser does not support the canvas element.</p>
        </canvas>
        <div class="info-panel">
          <ul id="nextPieceContainer">
            <li><div id="nextPiece"></div></li>
            <li><div id="scoreBoard"></div></li>
          </ul>
        </div>
      </div>

      <div class="player-section">
        <div class="player-label opponent-label">OPPONENT</div>
        <canvas id="opponentBoard" width="200" height="400"></canvas>
        <div class="info-panel">
          <div id="statusBoard"></div>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module">
      import { GameMultiplayer } from './js/gameMultiplayer.js';

      // Connect to the server
      const socket = io();

      // Create and start the multiplayer game
      const game = new GameMultiplayer(socket);

      // Join the game queue
      socket.emit('joinGame');
    </script>
  </body>
</html>
